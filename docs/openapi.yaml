  # --- BILLING MODULE ---
  /api/v1/billing/children/{childId}:
    get:
      summary: Розрахунок вартості навчання та харчування дитини (PARENT, ADMIN, MANAGER)
      description: |
        Харчування за місяць рахується за 21 день мінус зараховані відсутності цього місяця
        (див. Absences). Навчання й річна сума від відсутностей не залежать.
      tags:
        - Billing
      parameters:
        - in: path
          name: childId
          required: true
          schema:
            type: integer
        - in: query
          name: month
          required: false
          description: Місяць YYYY-MM; за замовчуванням поточний (за Києвом)
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
            example: '2026-10'
      responses:
        '200':
          description: Деталі чека за місяць і рік
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingCalculationResponse'
        '400':
          description: Дитина не закріплена за віковою групою або некоректний month
        '404':
          description: Дитину не знайдено
  /api/v1/billing/children/{childId}/price-tag:
    get:
      summary: Детальний розклад вартості (Price Tag) для батьків (PARENT, ADMIN, MANAGER)
      description: |
        Повертає детальний розклад формування суми до оплати:
        - Навчання: базова вартість, розмір пільги (відсоток і сума), річна знижка 12%, місячний та річний підсумок.
        - Харчування: ставка за день за віком групи, кількість робочих днів, вирахувані дні зарахованих відсутностей. Харчування не зменшується пільгами та знижками.
        - Два плани поруч: місячний (MONTHLY) та річний (YEARLY) з точно розрахованою річною економією.
        - Сума total строго дорівнює amountDue з білінгу.
        - Кумівство не відображається.
      tags:
        - Billing
      parameters:
        - in: path
          name: childId
          required: true
          schema:
            type: integer
          example: 5
        - in: query
          name: month
          required: false
          description: Місяць розрахунку YYYY-MM; за замовчуванням поточний (за Києвом)
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
            example: '2026-10'
      responses:
        '200':
          description: Детальний розклад цінника дитини
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceTagResponse'
        '400':
          description: Помилка валідації (некоректний childId, невірний формат month або дитина не закріплена за групою)
        '401':
          description: Не авторизовано (відсутній або невалідний токен)
        '403':
          description: Заборонено (роль TEACHER не має доступу)
        '404':
          description: Дитину не знайдено або чужа дитина для ролі PARENT
  /api/v1/billing/children/{childId}/payments:
    post:
      summary: Проведення оплати за навчання дитини (PARENT, ADMIN, MANAGER)
      tags:
        - Billing
      parameters:
        - in: path
          name: childId
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '201':
          description: Оплату успішно проведено, оплачений період продовжено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Дитина не є активною
        '404':
          description: Дитину не знайдено
        '409':
          description: Конфлікт статусу оплати (паралельний запит)\n
