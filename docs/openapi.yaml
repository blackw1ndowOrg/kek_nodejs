        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSlotRequest'
      responses:
        '200':
          description: Слот розкладу оновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleSlot'
        '400':
          description: Помилка валідації (наприклад, початок пізніше за кінець або призначення заняття на сон/їжу)
        '404':
          description: Слот або гурток не знайдено
        '409':
          description: Конфлікт розкладу (накладка, кімната зайнята, повторення гуртка або більше 3 занять на день)

