openapi: 3.0.3
info:
  title: Kindergarten Management System API
  description: |
    Інтерактивна API документація для бекенду дитячого садка (KEK Node.js team).

    Для виконання захищених запитів:
    1. Авторизуйтесь через `POST /api/v1/auth/login` та скопіюйте отриманий токен.
    2. Натисніть кнопку **Authorize** 🔓 вгорі сторінки.
    3. Введіть токен і натисніть **Authorize**.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Локальний сервер розробки
tags:
  - name: Health
    description: Перевірка працездатності сервера
  - name: Auth
    description: Автентифікація користувачів та отримання поточного профілю
  - name: Settings
    description: Керування константами та налаштуваннями садка (тільки ADMIN)
  - name: Rooms
    description: Керування приміщеннями (групові та гурткові кімнати)
  - name: Groups
    description: Керування віковими групами та зарахування/виписка дітей
  - name: Children
    description: Облік та керування вихованцями садка
  - name: Absences
    description: Відсутність дитини. Якщо батьки повідомили до 08:30 (Київ) дня відсутності, харчування за цей день не нараховується
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Введіть JWT токен авторизації'
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Некоректні вхідні дані
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          example: admin@kindergarten.local
        role:
          type: string
          enum: [ADMIN, MANAGER, TEACHER, PARENT]
          example: ADMIN
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@kindergarten.local
        password:
          type: string
          format: password
          example: Admin123!
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/User'
    SettingUpdate:
      type: object
      required:
        - value
      properties:
        value:
          oneOf:
            - type: integer
              example: 1600000
            - type: array
              items:
                type: integer
              example: [10, 20, 30]
    Room:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Кімната 101
        type:
          type: string
          enum: [GROUP, CLUB]
          example: GROUP
        monthlyCost:
          type: integer
          example: 5000000
    RoomCreate:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          example: Кімната 105
        type:
          type: string
          enum: [GROUP, CLUB]
          example: GROUP
        monthlyCost:
          type: integer
          example: 5000000
    RoomUpdate:
      type: object
      properties:
        name:
          type: string
          example: Оновлена назва кімнати
        type:
          type: string
          enum: [GROUP, CLUB]
          example: GROUP
        monthlyCost:
          type: integer
          example: 5500000
    Group:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Сонечко
        age:
          type: integer
          example: 3
        roomId:
          type: integer
          example: 1
        educatorId:
          type: integer
          nullable: true
          example: 7
        assistantId:
          type: integer
          nullable: true
          example: 11
    GroupCreate:
      type: object
      required:
        - name
        - age
        - roomId
      properties:
        name:
          type: string
          example: Веселка
        age:
          type: integer
          minimum: 2
          maximum: 6
          example: 4
        roomId:
          type: integer
          example: 2
        educatorId:
          type: integer
          nullable: true
          example: 7
        assistantId:
          type: integer
          nullable: true
          example: 11
    GroupUpdate:
      type: object
      properties:
        name:
          type: string
          example: Веселка (оновлена)
        age:
          type: integer
          minimum: 2
          maximum: 6
          example: 4
        roomId:
          type: integer
          example: 3
        educatorId:
          type: integer
          nullable: true
          example: 8
        assistantId:
          type: integer
          nullable: true
          example: 12
    EnrollChildRequest:
      type: object
      required:
        - childId
      properties:
        childId:
          type: integer
          example: 5
    Child:
      type: object
      properties:
        id:
          type: integer
          example: 1
        fullName:
          type: string
          example: Петренко Максим Васильович
        birthDate:
          type: string
          format: date-time
          example: '2021-05-15T00:00:00.000Z'
        notes:
          type: string
          nullable: true
          example: Алергія на цитрусові
        paymentPlan:
          type: string
          enum: [MONTHLY, YEARLY]
          example: MONTHLY
        discountPercent:
          type: integer
          example: 10
        hasDeputyRelatives:
          type: boolean
          example: false
        paidUntil:
          type: string
          format: date-time
          nullable: true
          example: '2026-11-30T00:00:00.000Z'
        isActive:
          type: boolean
          example: true
        groupId:
          type: integer
          nullable: true
          example: 1
    ChildCreate:
      type: object
      required:
        - fullName
        - birthDate
        - parentIds
      properties:
        fullName:
          type: string
          example: Коваленко Софія Іванівна
        birthDate:
          type: string
          format: date
          example: '2022-03-20'
        notes:
          type: string
          nullable: true
          example: Без особливостей
        paymentPlan:
          type: string
          enum: [MONTHLY, YEARLY]
          example: MONTHLY
        discountPercent:
          type: integer
          example: 0
        hasDeputyRelatives:
          type: boolean
          example: false
        parentIds:
          type: array
          items:
            type: integer
          example: [1]
    ChildUpdate:
      type: object
      properties:
        fullName:
          type: string
          example: Коваленко Софія Іванівна
        birthDate:
          type: string
          format: date
          example: '2022-03-20'
        notes:
          type: string
          nullable: true
          example: Оновлені примітки
        paymentPlan:
          type: string
          enum: [MONTHLY, YEARLY]
          example: YEARLY
        discountPercent:
          type: integer
          example: 12
        hasDeputyRelatives:
          type: boolean
          example: false
    Parent:
      type: object
      properties:
        id:
          type: integer
          example: 1
        fullName:
          type: string
          example: Петренко Василь Іванович
        phone:
          type: string
          example: '+380501234567'
        debt:
          type: integer
          description: Борг у копійках
          example: 0
        userId:
          type: integer
          nullable: true
          example: 16
    ParentCreate:
      type: object
      required:
        - fullName
        - phone
      properties:
        fullName:
          type: string
          example: Петренко Василь Іванович
        phone:
          type: string
          example: '+380501234567'
        debt:
          type: integer
          default: 0
          example: 0
        user:
          type: object
          required:
            - email
            - password
          properties:
            email:
              type: string
              format: email
              example: petro@example.com
            password:
              type: string
              format: password
              example: Password123!
    ParentUpdate:
      type: object
      properties:
        fullName:
          type: string
          example: Петренко Василь Іванович
        phone:
          type: string
          example: '+380509998877'
        debt:
          type: integer
          example: 150000
    Staff:
      type: object
      properties:
        id:
          type: integer
          example: 7
        fullName:
          type: string
          example: Олена Ковальчук
        type:
          type: string
          enum: [EDUCATOR, ASSISTANT, CLUB_TEACHER, MANAGER]
          example: EDUCATOR
        isActive:
          type: boolean
          example: true
        userId:
          type: integer
          nullable: true
          example: 8
    StaffCreate:
      type: object
      required:
        - fullName
        - type
      properties:
        fullName:
          type: string
          example: Олена Ковальчук
        type:
          type: string
          enum: [EDUCATOR, ASSISTANT, CLUB_TEACHER, MANAGER]
          example: EDUCATOR
        isActive:
          type: boolean
          default: true
          example: true
        user:
          type: object
          required:
            - email
            - password
          properties:
            email:
              type: string
              format: email
              example: olena@kindergarten.local
            password:
              type: string
              format: password
              example: Password123!
    StaffUpdate:
      type: object
      properties:
        fullName:
          type: string
          example: Олена Ковальчук
        type:
          type: string
          enum: [EDUCATOR, ASSISTANT, CLUB_TEACHER, MANAGER]
          example: EDUCATOR
        isActive:
          type: boolean
          example: true
    StaffSalaryResponse:
      type: object
      properties:
        staffId:
          type: integer
          example: 7
        fullName:
          type: string
          example: Олена Ковальчук
        type:
          type: string
          example: EDUCATOR
        salary:
          type: integer
          description: Зарплата у копійках
          example: 3400000
        isActive:
          type: boolean
          example: true
        details:
          type: object
          properties:
            childrenCount:
              type: integer
              nullable: true
              example: 14
            groupName:
              type: string
              nullable: true
              example: Дзвіночок
    BillingCalculationResponse:
      type: object
      properties:
        childId:
          type: integer
          example: 1
        fullName:
          type: string
          example: Петренко Максим Васильович
        groupAge:
          type: integer
          example: 3
        discountPercent:
          type: integer
          example: 10
        paymentPlan:
          type: string
          enum: [MONTHLY, YEARLY]
          example: MONTHLY
        currency:
          type: string
          example: UAH
        monthly:
          type: object
          properties:
            tuition:
              type: integer
              example: 1350000
            meals:
              type: integer
              description: Харчування за mealDays днів (у копійках)
              example: 760000
            total:
              type: integer
              example: 2110000
            month:
              type: string
              description: Місяць розрахунку YYYY-MM (query month або поточний за Києвом)
              example: '2026-10'
            mealDays:
              type: integer
              description: Днів харчування = 21 − absentDays, не менше 0
              example: 19
            absentDays:
              type: integer
              description: Зараховані відсутності за місяць (повідомлені до 08:30 дня відсутності)
              example: 2
        yearly:
          description: Річна сума відсутностей не враховує — вони наперед невідомі
          type: object
          properties:
            total:
              type: integer
              example: 22704000
        amountDue:
          type: integer
          example: 2150000
        paidUntil:
          type: string
          format: date-time
          nullable: true
          example: '2026-11-30T00:00:00.000Z'
        isPaid:
          type: boolean
          example: true
    PriceTagResponse:
      type: object
      required:
        - childId
        - fullName
        - groupAge
        - discountPercent
        - paymentPlan
        - currency
        - total
        - amountDue
        - monthly
        - yearly
        - tuition
        - meals
        - plans
        - savings
      properties:
        childId:
          type: integer
          example: 5
        fullName:
          type: string
          example: Петренко Максим Васильович
        groupAge:
          type: integer
          description: Вік групи дитини (визначає ставку харчування)
          example: 3
        discountPercent:
          type: integer
          description: Відсоток індивідуальної пільги дитини (0, 10, 20 або 30)
          example: 20
        paymentPlan:
          type: string
          enum: [MONTHLY, YEARLY]
          example: MONTHLY
        currency:
          type: string
          example: UAH
        paidUntil:
          type: string
          format: date
          nullable: true
          example: '2026-11-30'
        isPaid:
          type: boolean
          example: false
        total:
          type: integer
          description: Сума до оплати у копійках (відповідає amountDue з білінгу)
          example: 2040000
        amountDue:
          type: integer
          description: Сума до оплати у копійках для поточного плану дитини
          example: 2040000
        monthly:
          type: object
          properties:
            tuition:
              type: integer
              example: 1200000
            meals:
              type: integer
              example: 840000
            total:
              type: integer
              example: 2040000
            month:
              type: string
              example: '2026-10'
            mealDays:
              type: integer
              example: 21
            absentDays:
              type: integer
              example: 0
        yearly:
          type: object
          properties:
            tuition:
              type: integer
              example: 12672000
            meals:
              type: integer
              example: 10080000
            total:
              type: integer
              example: 22752000
        tuition:
          type: object
          description: Детальний розклад вартості навчання
          properties:
            base:
              type: integer
              description: Базова ціна за місяць у копійках (15 000 грн)
              example: 1500000
            discountPercent:
              type: integer
              example: 20
            discountAmount:
              type: integer
              description: Розмір пільги за місяць у копійках
              example: 300000
            discountUah:
              type: number
              description: Розмір пільги за місяць у гривнях
              example: 3000
            yearlyDiscountPercent:
              type: integer
              description: Знижка за річний план на навчання (12%)
              example: 12
            monthlyTuition:
              type: integer
              description: Підсумок за місяць з урахуванням пільги
              example: 1200000
            yearlyTuition:
              type: integer
              description: Підсумок за рік з урахуванням 12% річної знижки
              example: 12672000
            yearlyMonthlyEquivalent:
              type: integer
              description: Еквівалент навчання на місяць за річним планом (15 000 * (1 - discount/100) * 0.88)
              example: 1056000
        meals:
          type: object
          description: Детальний розклад вартості харчування
          properties:
            groupAge:
              type: integer
              example: 3
            ratePerDay:
              type: integer
              description: Денна ставка харчування у копійках (без жодних знижок)
              example: 40000
            workingDays:
              type: integer
              description: Кількість робочих днів у місяці
              example: 21
            absentDays:
              type: integer
              description: Зараховані дні відсутності (попереджено до 08:30)
              example: 0
            billableDays:
              type: integer
              description: Оплачувані дні (workingDays - absentDays)
              example: 21
            total:
              type: integer
              description: Підсумок харчування за місяць у копійках
              example: 840000
            yearlyWorkingDays:
              type: integer
              description: Кількість робочих днів у році
              example: 252
            yearlyTotal:
              type: integer
              description: Підсумок харчування за рік у копійках
              example: 10080000
            month:
              type: string
              example: '2026-10'
        plans:
          type: object
          description: Порівняння помісячного та річного планів
          properties:
            monthly:
              type: object
              properties:
                tuition:
                  type: object
                  properties:
                    base:
                      type: integer
                      example: 1500000
                    discountPercent:
                      type: integer
                      example: 20
                    discountAmount:
                      type: integer
                      example: 300000
                    discountUah:
                      type: number
                      example: 3000
                    total:
                      type: integer
                      example: 1200000
                meals:
                  type: object
                  properties:
                    groupAge:
                      type: integer
                      example: 3
                    ratePerDay:
                      type: integer
                      example: 40000
                    workingDays:
                      type: integer
                      example: 21
                    absentDays:
                      type: integer
                      example: 0
                    billableDays:
                      type: integer
                      example: 21
                    total:
                      type: integer
                      example: 840000
                total:
                  type: integer
                  example: 2040000
            yearly:
              type: object
              properties:
                tuition:
                  type: object
                  properties:
                    base:
                      type: integer
                      example: 18000000
                    baseMonthly:
                      type: integer
                      example: 1500000
                    discountPercent:
                      type: integer
                      example: 20
                    yearlyDiscountPercent:
                      type: integer
                      example: 12
                    monthlyEquivalent:
                      type: integer
                      example: 1056000
                    total:
                      type: integer
                      example: 12672000
                meals:
                  type: object
                  properties:
                    groupAge:
                      type: integer
                      example: 3
                    ratePerDay:
                      type: integer
                      example: 40000
                    workingDays:
                      type: integer
                      example: 252
                    absentDays:
                      type: integer
                      example: 0
                    billableDays:
                      type: integer
                      example: 252
                    total:
                      type: integer
                      example: 10080000
                total:
                  type: integer
                  example: 22752000
            savings:
              type: object
              description: Економія при виборі річного плану
              properties:
                amount:
                  type: integer
                  description: Сума економії за рік у копійках
                  example: 1728000
                amountUah:
                  type: number
                  description: Сума економії за рік у гривнях
                  example: 17280
                percent:
                  type: integer
                  example: 12
                description:
                  type: string
                  example: Економія 12% на оплаті навчання за рік
        savings:
          type: object
          properties:
            amount:
              type: integer
              example: 1728000
            amountUah:
              type: number
              example: 17280
            percent:
              type: integer
              example: 12
    Absence:
      type: object
      properties:
        id:
          type: integer
          example: 7
        childId:
          type: integer
          example: 1
        date:
          type: string
          format: date
          example: '2026-11-12'
        notifiedAt:
          type: string
          format: date-time
          description: Коли батьки повідомили; ставить сервер
          example: '2026-11-11T18:20:00.000Z'
        counted:
          type: boolean
          description: notifiedAt раніше за 08:30 (Київ) дня date — харчування за день не нараховується
          example: true
    AbsenceCreate:
      type: object
      required: [date]
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
          description: Будній день, не раніше за сьогодні (Київ). notifiedAt передавати не можна
          example: '2026-11-12'
    AbsenceListResponse:
      type: object
      properties:
        childId:
          type: integer
          example: 1
        month:
          type: string
          example: '2026-11'
        countedDays:
          type: integer
          description: Скільки відсутностей зараховано (counted = true)
          example: 1
        absences:
          type: array
          items:
            $ref: '#/components/schemas/Absence'
    PaymentRequest:
      type: object
      properties:
        plan:
          type: string
          enum: [MONTHLY, YEARLY]
          example: MONTHLY
    PaymentResponse:
      type: object
      properties:
        childId:
          type: integer
          example: 1
        plan:
          type: string
          example: MONTHLY
        amount:
          type: integer
          example: 2150000
        currency:
          type: string
          example: UAH
        paidUntil:
          type: string
          format: date-time
          example: '2026-12-30T00:00:00.000Z'
    Club:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Малювання
        roomId:
          type: integer
          example: 15
        teacherId:
          type: integer
          example: 11
    ClubCreate:
      type: object
      required:
        - name
        - roomId
        - teacherId
      properties:
        name:
          type: string
          example: Малювання
        roomId:
          type: integer
          example: 15
        teacherId:
          type: integer
          example: 11
    ClubUpdate:
      type: object
      properties:
        name:
          type: string
          example: Акварельне малювання
        roomId:
          type: integer
          example: 16
        teacherId:
          type: integer
          example: 12
    ScheduleSlot:
      type: object
      properties:
        id:
          type: integer
          example: 1
        groupId:
          type: integer
          example: 1
        dayOfWeek:
          type: integer
          minimum: 1
          maximum: 5
          description: День тижня (1 = понеділок, 5 = п'ятниця)
          example: 1
        startMinute:
          type: integer
          description: Хвилина початку від початку доби (наприклад, 540 = 09:00)
          example: 540
        endMinute:
          type: integer
          description: Хвилина завершення від початку доби (наприклад, 600 = 10:00)
          example: 600
        activity:
          type: string
          enum: [MEAL, CLUB, WALK, SLEEP, FREE_PLAY]
          example: CLUB
        clubId:
          type: integer
          nullable: true
          example: 1
        club:
          type: object
          nullable: true
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: Малювання
    UpdateSlotRequest:
      type: object
      properties:
        dayOfWeek:
          type: integer
          minimum: 1
          maximum: 5
          example: 2
        startMinute:
          type: integer
          example: 570
        endMinute:
          type: integer
          example: 630
        activity:
          type: string
          enum: [FREE_PLAY, CLUB]
          example: CLUB
        clubId:
          type: integer
          nullable: true
          example: 2
    Money:
      type: object
      properties:
        uah:
          type: number
          example: 3500.0
        kopiykas:
          type: integer
          example: 350000
    GroupProfitResponse:
      type: object
      properties:
        groupId:
          type: integer
          example: 1
        groupName:
          type: string
          example: Сонечко
        age:
          type: integer
          example: 3
        childrenCount:
          type: integer
          example: 15
        totalIncome:
          $ref: '#/components/schemas/Money'
        profit:
          $ref: '#/components/schemas/Money'
    TotalProfitResponse:
      type: object
      properties:
        totalIncome:
          $ref: '#/components/schemas/Money'
        totalExpenses:
          $ref: '#/components/schemas/Money'
        netProfit:
          $ref: '#/components/schemas/Money'
    ForecastRequest:
      type: object
      properties:
        targetChildrenCount:
          type: integer
          example: 100
        attendanceRate:
          type: number
          example: 0.8
        age2:
          type: integer
          example: 20
        age3:
          type: integer
          example: 25
        age4:
          type: integer
          example: 30
        age5:
          type: integer
          example: 25
security:
  - bearerAuth: []
paths:
  /api/v1/health:
    get:
      summary: Перевірка працездатності сервера
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Сервер працює коректно
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  # --- AUTH MODULE ---
  /api/v1/auth/login:
    post:
      summary: Вхід у систему та отримання JWT токена
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успішний вхід
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Помилка валідації вхідних даних
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Невірний email або пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/me:
    get:
      summary: Отримання інформації про поточного авторизованого користувача
      tags:
        - Auth
      responses:
        '200':
          description: Профіль користувача
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Неавторизований доступ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # --- SETTINGS MODULE ---
  /api/v1/settings:
    get:
      summary: Отримання всіх налаштувань садка (тільки ADMIN)
      tags:
        - Settings
      responses:
        '200':
          description: Список налаштувань (кеш)
          content:
            application/json:
              schema:
                type: object
                example:
                  tuitionMonthly: 1500000
                  yearlyDiscountPercent: 12
                  discountLevels: [10, 20, 30]
                  mealBasePerDay: 30000
                  managerSalary: 8000000
        '401':
          description: Відсутній токен
        '403':
          description: Недостатньо прав (потрібен ADMIN)

  /api/v1/settings/reload:
    post:
      summary: Примусове перезавантаження кешу налаштувань з БД (тільки ADMIN)
      tags:
        - Settings
      responses:
        '200':
          description: Кеш успішно перезавантажено
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Settings cache reloaded from database
        '403':
          description: Недостатньо прав

  /api/v1/settings/{key}:
    get:
      summary: Отримання одного значення налаштування за ключем
      tags:
        - Settings
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
          example: TUITION_MONTHLY
      responses:
        '200':
          description: Значення налаштування
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                    example: TUITION_MONTHLY
                  value:
                    oneOf:
                      - type: integer
                        example: 1500000
                      - type: array
                        items:
                          type: integer
                        example: [10, 20, 30]
        '404':
          description: Налаштування з таким ключем не знайдено
    put:
      summary: Оновлення значення налаштування через PUT (тільки ADMIN)
      tags:
        - Settings
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
          example: TUITION_MONTHLY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingUpdate'
      responses:
        '200':
          description: Налаштування успішно оновлено
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                    example: TUITION_MONTHLY
                  value:
                    oneOf:
                      - type: integer
                        example: 1600000
                      - type: array
                        items:
                          type: integer
                        example: [10, 20, 30]
        '400':
          description: Невалідне значення для налаштування
        '403':
          description: Недостатньо прав
        '404':
          description: Налаштування з таким ключем не знайдено
    patch:
      summary: Оновлення значення налаштування (тільки ADMIN)
      tags:
        - Settings
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
          example: TUITION_MONTHLY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingUpdate'
      responses:
        '200':
          description: Налаштування успішно оновлено
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                    example: TUITION_MONTHLY
                  value:
                    oneOf:
                      - type: integer
                        example: 1600000
                      - type: array
                        items:
                          type: integer
                        example: [10, 20, 30]
        '400':
          description: Невалідне значення для налаштування
        '403':
          description: Недостатньо прав
        '404':
          description: Ключ не знайдено

  # --- ROOMS MODULE ---
  /api/v1/rooms:
    get:
      summary: Отримання списку приміщень
      tags:
        - Rooms
      parameters:
        - in: query
          name: type
          required: false
          schema:
            type: string
            enum: [GROUP, CLUB]
          description: Фільтр за типом приміщення
      responses:
        '200':
          description: Список приміщень
          content:
            application/json:
              schema:
                type: object
                properties:
                  rooms:
                    type: array
                    items:
                      $ref: '#/components/schemas/Room'
    post:
      summary: Створення нового приміщення (тільки ADMIN)
      tags:
        - Rooms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomCreate'
      responses:
        '201':
          description: Приміщення створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '400':
          description: Помилка валідації
        '403':
          description: Недостатньо прав
        '409':
          description: Кімната з такою назвою вже існує або перевищено ліміт кімнат

  /api/v1/rooms/{id}:
    get:
      summary: Отримання інформації про приміщення за ID
      tags:
        - Rooms
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Деталі кімнати
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '404':
          description: Кімнату не знайдено
    patch:
      summary: Оновлення приміщення (тільки ADMIN)
      tags:
        - Rooms
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomUpdate'
      responses:
        '200':
          description: Кімнату оновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '403':
          description: Недостатньо прав
        '404':
          description: Кімнату не знайдено
    delete:
      summary: Видалення приміщення (тільки ADMIN)
      tags:
        - Rooms
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Кімнату успішно видалено
        '403':
          description: Недостатньо прав
        '404':
          description: Кімнату не знайдено
        '409':
          description: Неможливо видалити кімнату, в якій розміщена діюча група або гурток

  # --- GROUPS MODULE ---
  /api/v1/groups:
    get:
      summary: Отримання списку груп
      tags:
        - Groups
      parameters:
        - in: query
          name: age
          required: false
          schema:
            type: integer
            minimum: 2
            maximum: 6
          description: Фільтрація за віком групи
      responses:
        '200':
          description: Список груп
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items:
                      $ref: '#/components/schemas/Group'
    post:
      summary: Створення нової вікової групи (ADMIN, MANAGER)
      tags:
        - Groups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreate'
      responses:
        '201':
          description: Групу створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: Помилка валідації
        '409':
          description: Конфлікт (кімната вже зайнята або працівник не відповідає посаді)

  /api/v1/groups/{id}:
    get:
      summary: Отримання інформації про групу
      tags:
        - Groups
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Деталі групи
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '404':
          description: Групу не знайдено
    patch:
      summary: Оновлення групи (ADMIN, MANAGER)
      tags:
        - Groups
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupUpdate'
      responses:
        '200':
          description: Групу оновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '404':
          description: Групу не знайдено
        '409':
          description: Конфлікт призначення кімнати або персоналу
    delete:
      summary: Видалення групи (ADMIN, MANAGER)
      tags:
        - Groups
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Групу видалено
        '404':
          description: Групу не знайдено
        '409':
          description: Неможливо видалити групу, в якій є зараховані діти

  /api/v1/groups/{id}/children:
    post:
      summary: Зарахування дитини до групи (ADMIN, MANAGER)
      tags:
        - Groups
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID групи
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollChildRequest'
      responses:
        '204':
          description: Дитину успішно зараховано до групи
        '400':
          description: Вік дитини не відповідає віку групи
        '404':
          description: Групу або дитину не знайдено
        '409':
          description: Група переповнена або дитина вже зарахована

  /api/v1/groups/{id}/children/{childId}:
    delete:
      summary: Виписка дитини з групи (ADMIN, MANAGER)
      tags:
        - Groups
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID групи
        - in: path
          name: childId
          required: true
          schema:
            type: integer
          description: ID дитини
      responses:
        '204':
          description: Дитину успішно виписано з групи
        '404':
          description: Дитина не належить до цієї групи

  # --- CHILDREN MODULE ---
  /api/v1/children:
    get:
      summary: Отримання списку дітей
      tags:
        - Children
      parameters:
        - in: query
          name: groupId
          required: false
          schema:
            type: integer
          description: Фільтр за ID групи
        - in: query
          name: isActive
          required: false
          schema:
            type: boolean
          description: Фільтр за активністю
      responses:
        '200':
          description: Список дітей
          content:
            application/json:
              schema:
                type: object
                properties:
                  children:
                    type: array
                    items:
                      $ref: '#/components/schemas/Child'
    post:
      summary: Додавання нової дитини в систему (ADMIN, MANAGER)
      tags:
        - Children
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChildCreate'
      responses:
        '201':
          description: Дитину успішно зареєстровано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Child'
        '400':
          description: Помилка валідації (наприклад, вік поза межами 2-6 років)
        '404':
          description: Вказаних батьків не знайдено

  /api/v1/children/{id}:
    get:
      summary: Отримання картки дитини за ID
      tags:
        - Children
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Інформація про дитину
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Child'
        '404':
          description: Дитину не знайдено
    patch:
      summary: Оновлення картки дитини (ADMIN, MANAGER, PARENT)
      description: |
        Перевірки віку (на 1 вересня поточного навчального року):
        - нова `birthDate` — вік від 2 до 5 років;
        - нова `birthDate` дитини, яка лишається в групі, — вік дорівнює віку групи. Щоб змінити вік, спершу переведіть дитину в іншу групу;
        - повернення вибулої дитини (`isActive: true`) — вік від 2 до 5 років.
      tags:
        - Children
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChildUpdate'
      responses:
        '200':
          description: Дані дитини оновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Child'
        '400':
          description: Помилка валідації, вік поза межами 2–5 років або не збігається з віком групи
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Батьки можуть редагувати лише власну дитину і тільки дозволені поля
        '404':
          description: Дитину не знайдено
    delete:
      summary: Деактивація вихованця (ADMIN, MANAGER)
      tags:
        - Children
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Вихованця деактивовано
        '404':
          description: Дитину не знайдено\n
  # --- PARENTS MODULE ---
  /api/v1/children/{childId}/absences:
    parameters:
      - in: path
        name: childId
        required: true
        schema:
          type: integer
    post:
      summary: Повідомити про відсутність дитини (PARENT — лише своя дитина, ADMIN, MANAGER)
      description: |
        notifiedAt ставить сервер (поточний момент). Відсутність зараховується (counted = true),
        якщо повідомили раніше за 08:30 за Києвом у день відсутності; пізніше — запис лишається,
        але харчування за день нараховується.
      tags:
        - Absences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbsenceCreate'
      responses:
        '201':
          description: Відсутність записано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Absence'
        '400':
          description: Некоректна дата, вихідний, дата в минулому, дитина вибула або передано notifiedAt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Немає або недійсний токен
        '403':
          description: Роль без доступу (TEACHER)
        '404':
          description: Дитину не знайдено (і для чужої дитини батьків)
        '409':
          description: Відсутність на цю дату вже є
    get:
      summary: Відсутності дитини за місяць (PARENT — лише своя дитина, ADMIN, MANAGER)
      tags:
        - Absences
      parameters:
        - in: query
          name: month
          required: false
          description: Місяць YYYY-MM; за замовчуванням поточний (за Києвом)
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
            example: '2026-11'
      responses:
        '200':
          description: Відсутності за місяць, від ранніх до пізніх
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbsenceListResponse'
        '400':
          description: Некоректний month
        '401':
          description: Немає або недійсний токен
        '403':
          description: Роль без доступу (TEACHER)
        '404':
          description: Дитину не знайдено
  /api/v1/children/{childId}/absences/{absenceId}:
    delete:
      summary: Скасувати відсутність (PARENT — лише своя дитина, ADMIN, MANAGER)
      description: Можна до 08:30 за Києвом у день відсутності. Стан до скасування й автор зберігаються в історії змін (AuditLog)
      tags:
        - Absences
      parameters:
        - in: path
          name: childId
          required: true
          schema:
            type: integer
        - in: path
          name: absenceId
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Відсутність скасовано
        '401':
          description: Немає або недійсний токен
        '403':
          description: Роль без доступу (TEACHER)
        '404':
          description: Дитину або відсутність не знайдено (і для відсутності іншої дитини)
        '409':
          description: Уже 08:30 дня відсутності або пізніше — скасувати не можна
  /api/v1/parents:
    get:
      summary: Отримання списку батьків (ADMIN, MANAGER)
      tags:
        - Parents
      parameters:
        - in: query
          name: search
          required: false
          schema:
            type: string
          description: Пошук за ПІБ або номером телефону
      responses:
        '200':
          description: Список батьків
          content:
            application/json:
              schema:
                type: object
                properties:
                  parents:
                    type: array
                    items:
                      $ref: '#/components/schemas/Parent'
    post:
      summary: Створення картки батьків (+ опціонально акаунт User) (ADMIN, MANAGER)
      tags:
        - Parents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParentCreate'
      responses:
        '201':
          description: Батьків успішно створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parent'
        '400':
          description: Помилка валідації
        '409':
          description: Користувач з таким email вже існує

  /api/v1/parents/{id}:
    get:
      summary: Отримання картки батьків за ID (ADMIN, MANAGER)
      tags:
        - Parents
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Інформація про батьків та їх дітей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parent'
        '404':
          description: Батьків не знайдено
    patch:
      summary: Оновлення даних батьків (ADMIN, MANAGER)
      tags:
        - Parents
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParentUpdate'
      responses:
        '200':
