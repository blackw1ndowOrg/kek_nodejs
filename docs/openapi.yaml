openapi: 3.0.3
info:
  title: Kindergarten Management System API
  description: |
    Інтерактивна API документація для бекенду дитячого садка (KEK Node.js team).
    
    Для виконання захищених запитів:
    1. Авторизуйтесь через `POST /api/v1/auth/login` та скопіюйте отриманий токен.
    2. Натисніть кнопку **Authorize** 🔓 вгорі сторінки.
    3. Введіть токен і натисніть **Authorize**.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Локальний сервер розробки
tags:
  - name: Health
    description: Перевірка працездатності сервера
  - name: Auth
    description: Автентифікація користувачів та отримання поточного профілю
  - name: Settings
    description: Керування константами та налаштуваннями садка (тільки ADMIN)
  - name: Rooms
    description: Керування приміщеннями (групові та гурткові кімнати)
  - name: Groups
    description: Керування віковими групами та зарахування/виписка дітей
  - name: Children
    description: Облік та керування вихованцями садка
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Введіть JWT токен авторизації'
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Некоректні вхідні дані
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          example: admin@kindergarten.local
        role:
          type: string
          enum: [ADMIN, MANAGER, TEACHER, PARENT]
          example: ADMIN
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@kindergarten.local
        password:
          type: string
          format: password
          example: Admin123!
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/User'
    SettingUpdate:
      type: object
      required:
        - value
      properties:
        value:
          oneOf:
            - type: integer
              example: 1600000
            - type: array
              items:
                type: integer
              example: [10, 20, 30]
    Room:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Кімната 101
        type:
          type: string
          enum: [GROUP, CLUB]
          example: GROUP
        monthlyCost:
          type: integer
          example: 5000000
    RoomCreate:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          example: Кімната 105
        type:
          type: string
          enum: [GROUP, CLUB]
          example: GROUP
        monthlyCost:
          type: integer
          example: 5000000
    RoomUpdate:
      type: object
      properties:
        name:
          type: string
          example: Оновлена назва кімнати
        type:
          type: string
          enum: [GROUP, CLUB]
          example: GROUP
        monthlyCost:
          type: integer
          example: 5500000
    Group:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Сонечко
        age:
          type: integer
          example: 3
        roomId:
          type: integer
          example: 1
        educatorId:
          type: integer
          nullable: true
          example: 7
        assistantId:
          type: integer
          nullable: true
          example: 11
    GroupCreate:
      type: object
      required:
        - name
        - age
        - roomId
      properties:
        name:
          type: string
          example: Веселка
        age:
          type: integer
          minimum: 2
          maximum: 6
          example: 4
        roomId:
          type: integer
          example: 2
        educatorId:
          type: integer
          nullable: true
          example: 7
        assistantId:
          type: integer
          nullable: true
          example: 11
    GroupUpdate:
      type: object
      properties:
        name:
          type: string
          example: Веселка (оновлена)
        age:
          type: integer
          minimum: 2
          maximum: 6
          example: 4
        roomId:
          type: integer
          example: 3
        educatorId:
          type: integer
          nullable: true
          example: 8
        assistantId:
          type: integer
          nullable: true
          example: 12
    EnrollChildRequest:
      type: object
      required:
        - childId
      properties:
        childId:
          type: integer
          example: 5
    Child:
      type: object
      properties:
        id:
          type: integer
          example: 1
        fullName:
          type: string
          example: Петренко Максим Васильович
        birthDate:
          type: string
          format: date
          example: '2021-05-15'
        notes:
          type: string
          nullable: true
          example: Алергія на цитрусові
        paymentPlan:
          type: string
          enum: [MONTHLY, YEARLY]
          example: MONTHLY
        discountPercent:
          type: integer
          example: 10
        hasDeputyRelatives:
          type: boolean
          example: false
        paidUntil:
          type: string
          format: date
          nullable: true
          example: '2026-11-30'
        isActive:
          type: boolean
          example: true
        groupId:
          type: integer
          nullable: true
          example: 1
    ChildCreate:
      type: object
      required:
        - fullName
        - birthDate
        - parentIds
      properties:
        fullName:
          type: string
          example: Коваленко Софія Іванівна
        birthDate:
          type: string
          format: date
          example: '2022-03-20'
        notes:
          type: string
          nullable: true
          example: Без особливостей
        paymentPlan:
          type: string
          enum: [MONTHLY, YEARLY]
          example: MONTHLY
        discountPercent:
          type: integer
          example: 0
        hasDeputyRelatives:
          type: boolean
          example: false
        parentIds:
          type: array
          items:
            type: integer
          example: [1]
    ChildUpdate:
      type: object
      properties:
        fullName:
          type: string
          example: Коваленко Софія Іванівна
        birthDate:
          type: string
          format: date
          example: '2022-03-20'
        notes:
          type: string
          nullable: true
          example: Оновлені примітки
        paymentPlan:
          type: string
          enum: [MONTHLY, YEARLY]
          example: YEARLY
        discountPercent:
          type: integer
          example: 12
        hasDeputyRelatives:
          type: boolean
          example: false
security:
  - bearerAuth: []
paths:
  /api/v1/health:
    get:
      summary: Перевірка працездатності сервера
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Сервер працює коректно
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  # --- AUTH MODULE ---
  /api/v1/auth/login:
    post:
      summary: Вхід у систему та отримання JWT токена
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успішний вхід
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Помилка валідації вхідних даних
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Невірний email або пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/me:
    get:
      summary: Отримання інформації про поточного авторизованого користувача
      tags:
        - Auth
      responses:
        '200':
          description: Профіль користувача
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Неавторизований доступ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # --- SETTINGS MODULE ---
  /api/v1/settings:
    get:
      summary: Отримання всіх налаштувань садка (тільки ADMIN)
      tags:
        - Settings
      responses:
        '200':
          description: Список налаштувань (кеш)
          content:
            application/json:
              schema:
                type: object
                example:
                  tuitionMonthly: 1500000
                  yearlyDiscountPercent: 12
                  discountLevels: [10, 20, 30]
                  mealBasePerDay: 30000
                  managerSalary: 8000000
        '401':
          description: Відсутній токен
        '403':
          description: Недостатньо прав (потрібен ADMIN)

  /api/v1/settings/reload:
    post:
      summary: Примусове перезавантаження кешу налаштувань з БД (тільки ADMIN)
      tags:
        - Settings
      responses:
        '200':
          description: Кеш успішно перезавантажено
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Settings cache reloaded from database
        '403':
          description: Недостатньо прав

  /api/v1/settings/{key}:
    get:
      summary: Отримання одного значення налаштування за ключем
      tags:
        - Settings
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
          example: TUITION_MONTHLY
      responses:
        '200':
          description: Значення налаштування
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                    example: TUITION_MONTHLY
                  value:
                    type: integer
                    example: 1500000
        '404':
          description: Налаштування з таким ключем не знайдено
    patch:
      summary: Оновлення значення налаштування (тільки ADMIN)
      tags:
        - Settings
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
          example: TUITION_MONTHLY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingUpdate'
      responses:
        '200':
          description: Налаштування успішно оновлено
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                    example: TUITION_MONTHLY
                  value:
                    type: integer
                    example: 1600000
        '400':
          description: Невалідне значення для налаштування
        '403':
          description: Недостатньо прав
        '404':
          description: Ключ не знайдено

  # --- ROOMS MODULE ---
  /api/v1/rooms:
    get:
      summary: Отримання списку приміщень
      tags:
        - Rooms
      parameters:
        - in: query
          name: type
          required: false
          schema:
            type: string
            enum: [GROUP, CLUB]
          description: Фільтр за типом приміщення
      responses:
        '200':
          description: Список приміщень
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Room'
    post:
      summary: Створення нового приміщення (тільки ADMIN)
      tags:
        - Rooms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomCreate'
      responses:
        '201':
          description: Приміщення створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '400':
          description: Помилка валідації
        '403':
          description: Недостатньо прав
        '409':
          description: Кімната з такою назвою вже існує або перевищено ліміт кімнат

  /api/v1/rooms/{id}:
    get:
      summary: Отримання інформації про приміщення за ID
      tags:
        - Rooms
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Деталі кімнати
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '404':
          description: Кімнату не знайдено
    patch:
      summary: Оновлення приміщення (тільки ADMIN)
      tags:
        - Rooms
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomUpdate'
      responses:
        '200':
          description: Кімнату оновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '403':
          description: Недостатньо прав
        '404':
          description: Кімнату не знайдено
    delete:
      summary: Видалення приміщення (тільки ADMIN)
      tags:
        - Rooms
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Кімнату успішно видалено
        '403':
          description: Недостатньо прав
        '404':
          description: Кімнату не знайдено
        '409':
          description: Неможливо видалити кімнату, в якій розміщена діюча група або гурток

  # --- GROUPS MODULE ---
  /api/v1/groups:
    get:
      summary: Отримання списку груп
      tags:
        - Groups
      parameters:
        - in: query
          name: age
          required: false
          schema:
            type: integer
            minimum: 2
            maximum: 6
          description: Фільтрація за віком групи
      responses:
        '200':
          description: Список груп
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
    post:
      summary: Створення нової вікової групи (ADMIN, MANAGER)
      tags:
        - Groups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreate'
      responses:
        '201':
          description: Групу створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: Помилка валідації
        '409':
          description: Конфлікт (кімната вже зайнята або працівник не відповідає посаді)

  /api/v1/groups/{id}:
    get:
      summary: Отримання інформації про групу
      tags:
        - Groups
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Деталі групи
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '404':
          description: Групу не знайдено
    patch:
      summary: Оновлення групи (ADMIN, MANAGER)
      tags:
        - Groups
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupUpdate'
      responses:
        '200':
          description: Групу оновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '404':
          description: Групу не знайдено
        '409':
          description: Конфлікт призначення кімнати або персоналу
    delete:
      summary: Видалення групи (ADMIN, MANAGER)
      tags:
        - Groups
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Групу видалено
        '404':
          description: Групу не знайдено
        '409':
          description: Неможливо видалити групу, в якій є зараховані діти

  /api/v1/groups/{id}/children:
    post:
      summary: Зарахування дитини до групи (ADMIN, MANAGER)
      tags:
        - Groups
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID групи
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollChildRequest'
      responses:
        '200':
          description: Дитину успішно зараховано до групи
        '400':
          description: Вік дитини не відповідає віку групи
        '404':
          description: Групу або дитину не знайдено
        '409':
          description: Група переповнена або дитина вже зарахована

  /api/v1/groups/{id}/children/{childId}:
    delete:
      summary: Виписка дитини з групи (ADMIN, MANAGER)
      tags:
        - Groups
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID групи
        - in: path
          name: childId
          required: true
          schema:
            type: integer
          description: ID дитини
      responses:
        '204':
          description: Дитину успішно виписано з групи
        '404':
          description: Дитина не належить до цієї групи

  # --- CHILDREN MODULE ---
  /api/v1/children:
    get:
      summary: Отримання списку дітей
      tags:
        - Children
      parameters:
        - in: query
          name: groupId
          required: false
          schema:
            type: integer
          description: Фільтр за ID групи
        - in: query
          name: isActive
          required: false
          schema:
            type: boolean
          description: Фільтр за активністю
      responses:
        '200':
          description: Список дітей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Child'
    post:
      summary: Додавання нової дитини в систему (ADMIN, MANAGER)
      tags:
        - Children
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChildCreate'
      responses:
        '201':
          description: Дитину успішно зареєстровано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Child'
        '400':
          description: Помилка валідації (наприклад, вік поза межами 2-6 років)
        '404':
          description: Вказаних батьків не знайдено

  /api/v1/children/{id}:
    get:
      summary: Отримання картки дитини за ID
      tags:
        - Children
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Інформація про дитину
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Child'
        '404':
          description: Дитину не знайдено
    patch:
      summary: Оновлення картки дитини (ADMIN, MANAGER, PARENT)
      tags:
        - Children
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChildUpdate'
      responses:
        '200':
          description: Дані дитини оновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Child'
        '403':
          description: Батьки можуть редагувати лише власну дитину і тільки дозволені поля
        '404':
          description: Дитину не знайдено
    delete:
      summary: Деактивація вихованця (ADMIN, MANAGER)
      tags:
        - Children
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Вихованця деактивовано
        '404':
          description: Дитину не знайдено\n
  # --- PARENTS MODULE ---
  /api/v1/parents:
    get:
      summary: Отримання списку батьків (ADMIN, MANAGER)
      tags:
        - Parents
      parameters:
        - in: query
          name: search
          required: false
          schema:
            type: string
          description: Пошук за ПІБ або номером телефону
      responses:
        '200':
          description: Список батьків
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Parent'
    post:
      summary: Створення картки батьків (+ опціонально акаунт User) (ADMIN, MANAGER)
      tags:
        - Parents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParentCreate'
      responses:
        '201':
          description: Батьків успішно створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parent'
        '400':
          description: Помилка валідації
        '409':
          description: Користувач з таким email вже існує

  /api/v1/parents/{id}:
    get:
      summary: Отримання картки батьків за ID (ADMIN, MANAGER)
      tags:
        - Parents
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Інформація про батьків та їх дітей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parent'
        '404':
          description: Батьків не знайдено
    patch:
      summary: Оновлення даних батьків (ADMIN, MANAGER)
      tags:
        - Parents
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParentUpdate'
      responses:
        '200':
          description: Дані батьків успішно оновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parent'
        '404':
          description: Батьків не знайдено
    delete:
      summary: Видалення картки батьків (ADMIN, MANAGER)
      tags:
        - Parents
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Картку батьків успішно видалено
        '404':
          description: Батьків не знайдено
        '409':
          description: Неможливо видалити з непогашеним боргом або якщо дитина залишиться сиротою

  # --- STAFF MODULE ---
  /api/v1/staff:
    get:
      summary: Отримання списку співробітників (ADMIN, MANAGER, TEACHER)
      tags:
        - Staff
      parameters:
        - in: query
          name: type
          required: false
          schema:
            type: string
            enum: [EDUCATOR, ASSISTANT, CLUB_TEACHER, MANAGER]
          description: Фільтр за посадою
        - in: query
          name: isActive
          required: false
          schema:
            type: boolean
          description: Фільтр за статусом активності
        - in: query
          name: search
          required: false
          schema:
            type: string
          description: Пошук за ПІБ (нечутливий до регістру)
      responses:
        '200':
          description: Список співробітників
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Staff'
    post:
      summary: Реєстрація співробітника (+ акаунт User) (ADMIN, MANAGER)
      tags:
        - Staff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffCreate'
      responses:
        '201':
          description: Співробітника зареєстровано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Staff'
        '400':
          description: Помилка валідації
        '409':
          description: Користувач з таким email вже існує

  /api/v1/staff/{id}:
    get:
      summary: Інформація про співробітника, його групи та гуртки (ADMIN, MANAGER, TEACHER)
      tags:
        - Staff
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Деталі співробітника
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Staff'
        '404':
          description: Співробітника не знайдено
    patch:
      summary: Оновлення ПІБ, посади або статусу активності (ADMIN, MANAGER)
      tags:
        - Staff
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffUpdate'
      responses:
        '200':
          description: Дані співробітника оновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Staff'
        '404':
          description: Співробітника не знайдено
        '409':
          description: Заборонено змінювати посаду чи вимикати співробітника з активною групою/гуртком
    delete:
      summary: Видалення співробітника (ADMIN, MANAGER)
      tags:
        - Staff
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Співробітника видалено
        '404':
          description: Співробітника не знайдено
        '409':
          description: Неможливо видалити працівника, закріпленого за діючою групою або гуртком

  /api/v1/staff/{id}/salary:
    get:
      summary: Розрахунок заробітної плати співробітника (ADMIN, MANAGER)
      tags:
        - Staff
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Розрахунок заробітної плати
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffSalaryResponse'
        '403':
          description: Недостатньо прав (потрібен ADMIN або MANAGER)
        '404':
          description: Співробітника не знайдено

  # --- BILLING MODULE ---
  /api/v1/billing/children/{childId}:
    get:
      summary: Розрахунок вартості навчання та харчування дитини (PARENT, ADMIN, MANAGER)
      tags:
        - Billing
      parameters:
        - in: path
          name: childId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Деталі чека за місяць і рік
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingCalculationResponse'
        '400':
          description: Дитина не закріплена за віковою групою
        '404':
          description: Дитину не знайдено
  /api/v1/billing/children/{childId}/payments:
    post:
      summary: Проведення оплати за навчання дитини (PARENT, ADMIN, MANAGER)
      tags:
        - Billing
      parameters:
        - in: path
          name: childId
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Оплату успішно проведено, оплачений період продовжено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Дитина не є активною
        '404':
          description: Дитину не знайдено
        '409':
          description: Конфлікт статусу оплати (паралельний запит)
