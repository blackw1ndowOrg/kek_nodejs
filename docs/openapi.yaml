        '404':
          description: Групу не знайдено

  /api/v1/schedule/slots/{id}:
    patch:
      summary: Ручне редагування окремого слота розкладу (тільки ADMIN)
      tags:
        - Schedule
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
