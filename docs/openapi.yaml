  # --- SCHEDULE MODULE ---
  /api/v1/schedule/generate:
    post:
      summary: Автоматична генерація розкладу занять на тиждень (тільки ADMIN)
      tags:
        - Schedule
      responses:
        '201':
          description: Розклад успішно згенеровано
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: integer
                    example: 4
                  clubs:
                    type: integer
                    example: 5
                  slots:
                    type: integer
                    example: 260
        '403':
          description: Недостатньо прав
        '422':
          description: Неможливо скласти розклад (нестача гуртків або переповнення)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/schedule/my:
    get:
      summary: Отримання персонального розкладу для поточного викладача (тільки TEACHER)
      tags:
        - Schedule
      responses:
        '200':
          description: Розклад занять викладача
          content:
            application/json:
              schema:
                type: object
                properties:
                  slots:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScheduleSlot'
        '403':
          description: Доступно тільки для ролі TEACHER

  /api/v1/schedule/groups/{groupId}:
    get:
      summary: Отримання тижневого розкладу конкретної групи (ADMIN, MANAGER, TEACHER, PARENT)
      tags:
        - Schedule
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Слоти розкладу групи
          content:
            application/json:
              schema:
                type: object
                properties:
                  group:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: Сонечко
                      age:
                        type: integer
                        example: 2
                  slots:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScheduleSlot'
        '404':
          description: Групу не знайдено
    delete:
      summary: Очищення розкладу групи (тільки ADMIN)
      tags:
        - Schedule
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: integer
