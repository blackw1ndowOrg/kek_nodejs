services:
  postgres:
    image: postgres:16-alpine
    container_name: kindergarten-postgres
    environment:
      POSTGRES_USER: kg
      POSTGRES_PASSWORD: kg
      POSTGRES_DB: kindergarten
    ports:
      - '${DB_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kg -d kindergarten']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
