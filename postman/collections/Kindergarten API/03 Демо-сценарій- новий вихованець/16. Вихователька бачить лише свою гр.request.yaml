$kind: http-request
name: 16. Вихователька бачить лише свою групу
url: "{{baseUrl}}/groups"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{demoEducatorToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      const groups = pm.response.json().groups;
      pm.test('Одна група — тестова', () => {
        pm.expect(groups).to.have.length(1);
        pm.expect(groups[0].id).to.eql(Number(pm.collectionVariables.get('demoGroupId')));
      });
    language: text/javascript
order: 16000
