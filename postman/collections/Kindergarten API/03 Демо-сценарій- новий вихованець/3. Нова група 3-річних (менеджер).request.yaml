$kind: http-request
url: "{{baseUrl}}/groups"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Тестова група {{demoSuffix}}",
      "age": 3,
      "roomId": {{demoRoomId}},
      "educatorId": {{demoEducatorId}}
    }
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 201', () => pm.response.to.have.status(201));
      const group = pm.response.json();
      pm.test('Порожня група', () => pm.expect(group.childrenCount).to.eql(0));
      pm.collectionVariables.set('demoGroupId', group.id);
    language: text/javascript
order: 3000
