$kind: http-request
url: "{{baseUrl}}/groups/{{demoGroupId}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      const group = pm.response.json();
      pm.test('Дитина в списку групи', () =>
        pm.expect(group.children.map((c) => c.id)).to.include(Number(pm.collectionVariables.get('demoChildId'))));
      pm.test('Кімната й вихователька на місці', () => {
        pm.expect(group.room.id).to.eql(Number(pm.collectionVariables.get('demoRoomId')));
        pm.expect(group.educator.id).to.eql(Number(pm.collectionVariables.get('demoEducatorId')));
      });
    language: text/javascript
order: 7000
