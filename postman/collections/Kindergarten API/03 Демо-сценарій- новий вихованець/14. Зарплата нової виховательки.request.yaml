$kind: http-request
url: "{{baseUrl}}/staff/{{demoEducatorId}}/salary"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      const salary = pm.response.json();
      pm.test('1 дитина → 2 000 грн', () => {
        pm.expect(salary.details.childrenCount).to.eql(1);
        pm.expect(salary.salary).to.eql(200000);
      });
    language: text/javascript
order: 14000
