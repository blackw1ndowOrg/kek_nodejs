$kind: http-request
url: "{{baseUrl}}/parents"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Тестовий Батько",
      "phone": "+380501234567",
      "user": {
        "email": "parent.demo{{demoSuffix}}@example.com",
        "password": "{{seedPassword}}"
      }
    }
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('demoParentId', pm.response.json().id);
      pm.collectionVariables.set('demoParentEmail', `parent.demo${pm.collectionVariables.get('demoSuffix')}@example.com`);
    language: text/javascript
order: 4000
