$kind: http-request
url: "{{baseUrl}}/groups/{{demoGroupId}}/children"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "childId": {{demoChildId}}
    }
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Статус 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 6000
