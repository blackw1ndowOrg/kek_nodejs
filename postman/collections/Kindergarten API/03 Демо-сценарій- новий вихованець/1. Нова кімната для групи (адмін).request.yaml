$kind: http-request
url: "{{baseUrl}}/rooms"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Кімната Тест {{demoSuffix}}",
      "type": "GROUP"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('demoSuffix', Date.now());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Статус 201', () => pm.response.to.have.status(201));
      pm.test('Вартість за замовчуванням 50 000 грн', () =>
        pm.expect(pm.response.json().monthlyCost).to.eql(5000000));
      pm.collectionVariables.set('demoRoomId', pm.response.json().id);
    language: text/javascript
order: 1000
