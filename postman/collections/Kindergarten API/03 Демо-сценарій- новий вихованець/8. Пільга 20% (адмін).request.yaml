$kind: http-request
url: "{{baseUrl}}/children/{{demoChildId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "discountPercent": 20
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      pm.test('Знижка 20%', () => pm.expect(pm.response.json().discountPercent).to.eql(20));
    language: text/javascript
order: 8000
