$kind: http-request
name: Вихователька замість викладача гуртка → 400
url: "{{baseUrl}}/clubs"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Гурток Тест {{demoSuffix}}",
      "roomId": {{clubRoomId}},
      "teacherId": {{groupSonechkoEducatorId}}
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Статус 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 8000
