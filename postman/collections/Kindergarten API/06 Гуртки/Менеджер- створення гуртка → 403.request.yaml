$kind: http-request
name: "Менеджер: створення гуртка → 403"
url: "{{baseUrl}}/clubs"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Не можна",
      "roomId": 1,
      "teacherId": 1
    }
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Статус 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 2000
