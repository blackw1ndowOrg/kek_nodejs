$kind: http-request
url: "{{baseUrl}}/clubs"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Гурток Тест {{demoSuffix}}",
      "roomId": {{clubRoomId}},
      "teacherId": {{clubTeacherId}}
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 201', () => pm.response.to.have.status(201));
      const club = pm.response.json();
      pm.test('Кімната й викладач на місці', () => {
        pm.expect(club.room.id).to.eql(Number(pm.collectionVariables.get('clubRoomId')));
        pm.expect(club.teacher.id).to.eql(Number(pm.collectionVariables.get('clubTeacherId')));
      });
      pm.collectionVariables.set('clubId', club.id);
    language: text/javascript
order: 10000
