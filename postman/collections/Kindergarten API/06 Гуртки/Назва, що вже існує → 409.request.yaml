$kind: http-request
url: "{{baseUrl}}/clubs"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "{{busyClubName}}",
      "roomId": {{clubRoomId}},
      "teacherId": {{clubTeacherId}}
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 409', () => pm.response.to.have.status(409));
      pm.test('Пояснення про назву', () => pm.expect(pm.response.json().error.message).to.include('назвою'));
    language: text/javascript
order: 9000
