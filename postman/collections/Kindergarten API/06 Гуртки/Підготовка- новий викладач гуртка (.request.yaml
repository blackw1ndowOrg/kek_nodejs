$kind: http-request
name: "Підготовка: новий викладач гуртка (менеджер)"
url: "{{baseUrl}}/staff"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Тестовий Викладач",
      "type": "CLUB_TEACHER"
    }
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('clubTeacherId', pm.response.json().id);
    language: text/javascript
order: 4000
