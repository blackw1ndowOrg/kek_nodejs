$kind: http-request
name: "Підготовка: вільний кабінет (адмін)"
url: "{{baseUrl}}/rooms"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Кабінет Тест {{demoSuffix}}",
      "type": "CLUB"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('demoSuffix', Date.now());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Статус 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('clubRoomId', pm.response.json().id);
    language: text/javascript
order: 3000
