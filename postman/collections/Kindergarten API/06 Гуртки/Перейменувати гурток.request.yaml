$kind: http-request
url: "{{baseUrl}}/clubs/{{clubId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Гурток Тест {{demoSuffix}} (новий)"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      pm.test('Нова назва', () => pm.expect(pm.response.json().name).to.include('(новий)'));
    language: text/javascript
order: 11000
