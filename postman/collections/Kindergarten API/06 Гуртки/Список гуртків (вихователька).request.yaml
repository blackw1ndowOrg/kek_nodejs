$kind: http-request
url: "{{baseUrl}}/clubs"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{educatorToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      const clubs = pm.response.json().clubs;
      pm.test('5 гуртків, у кожного кімната CLUB і викладач', () => {
        pm.expect(clubs).to.have.length(5);
        clubs.forEach((c) => {
          pm.expect(c.room.type).to.eql('CLUB');
          pm.expect(c.teacher).to.have.property('fullName');
        });
      });
      pm.collectionVariables.set('busyClubRoomId', clubs[0].room.id);
      pm.collectionVariables.set('busyClubTeacherId', clubs[0].teacher.id);
      pm.collectionVariables.set('busyClubName', clubs[0].name);
    language: text/javascript
order: 1000
