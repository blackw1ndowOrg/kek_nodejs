$kind: http-request
url: "{{baseUrl}}/clubs"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Гурток Тест {{demoSuffix}}",
      "roomId": {{clubRoomId}},
      "teacherId": {{busyClubTeacherId}}
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Статус 409', () => pm.response.to.have.status(409));
    language: text/javascript
order: 7000
