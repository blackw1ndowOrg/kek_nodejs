$kind: http-request
url: "{{baseUrl}}/clubs/{{clubId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: "{}"
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Статус 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 12000
