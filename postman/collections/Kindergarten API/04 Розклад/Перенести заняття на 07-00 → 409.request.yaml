$kind: http-request
name: Перенести заняття на 07:00 → 409
url: "{{baseUrl}}/schedule/slots/{{lessonSlotId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "startMinute": 420,
      "endMinute": 465
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 409', () => pm.response.to.have.status(409));
      pm.test('Поза межами дня', () => pm.expect(pm.response.json().error.message).to.include('OUT_OF_HOURS'));
    language: text/javascript
order: 6000
