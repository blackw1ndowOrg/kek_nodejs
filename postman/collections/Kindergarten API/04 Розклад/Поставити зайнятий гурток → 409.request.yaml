$kind: http-request
url: "{{baseUrl}}/schedule/slots/{{lessonSlotId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "clubId": {{busyClubId}}
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 409', () => pm.response.to.have.status(409));
      pm.test('Конфлікт кабінету', () =>
        pm.expect(pm.response.json().error.message).to.include('CLUB_DOUBLE_BOOKED'));
    language: text/javascript
order: 5000
