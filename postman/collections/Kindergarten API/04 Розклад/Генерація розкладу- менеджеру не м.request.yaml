$kind: http-request
name: "Генерація розкладу: менеджеру не можна → 403"
url: "{{baseUrl}}/schedule/generate"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Статус 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 1000
