$kind: http-request
url: "{{baseUrl}}/schedule/my"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{educatorToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      const slots = pm.response.json().slots;
      pm.test('70 слотів на тиждень (14 на день)', () => pm.expect(slots).to.have.length(70));
      pm.test('Лише слоти групи «Сонечко»', () =>
        slots.forEach((s) => pm.expect(s.group.name).to.eql('Сонечко')));
    language: text/javascript
order: 8000
