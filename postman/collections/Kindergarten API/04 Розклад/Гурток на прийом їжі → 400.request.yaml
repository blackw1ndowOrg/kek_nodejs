$kind: http-request
url: "{{baseUrl}}/schedule/slots/{{mealSlotId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "clubId": {{busyClubId}}
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Статус 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 7000
