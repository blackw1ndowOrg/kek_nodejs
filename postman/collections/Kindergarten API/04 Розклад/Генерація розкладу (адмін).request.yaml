$kind: http-request
url: "{{baseUrl}}/schedule/generate"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 201', () => pm.response.to.have.status(201));
      const result = pm.response.json();
      pm.test('14 слотів на день на кожну групу (3 прийоми їжі, сон, 9 слотів занять і прогулянок, вільна гра)', () =>
        pm.expect(result.slots).to.eql(result.groups * 5 * 14));
    language: text/javascript
order: 2000
