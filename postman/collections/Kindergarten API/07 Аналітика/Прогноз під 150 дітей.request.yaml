$kind: http-request
url: "{{baseUrl}}/analytics/forecast"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "targetChildrenCount": 150
    }
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      const r = pm.response.json().recommended;
      pm.test('Прийнято 150 дітей', () => pm.expect(r.totalAdmitted).to.eql(150));
      pm.test('Не більше 15 груп (20 кімнат − 5 кабінетів)', () => pm.expect(r.totalGroups).to.be.at.most(15));
      pm.test('У групі не більше 20 дітей', () => r.groupsList.forEach((g) =>
        pm.expect(g.childrenCount).to.be.within(1, 20)));
      pm.test('Є текстовий висновок', () => pm.expect(r.summary).to.be.a('string'));
    language: text/javascript
order: 8000
