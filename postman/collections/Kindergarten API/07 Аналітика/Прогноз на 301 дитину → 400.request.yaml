$kind: http-request
url: "{{baseUrl}}/analytics/forecast"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "targetChildrenCount": 301
    }
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Статус 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 10000
