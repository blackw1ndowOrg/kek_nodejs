$kind: http-request
url: "{{baseUrl}}/analytics/groups/{{groupDzvinochokId}}/profit?attendanceRate=1"
method: GET
queryParams:
  attendanceRate: "1"
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      pm.test('Харчування: 400 грн · 21 день · 14 дітей = 117 600 грн', () =>
        pm.expect(pm.response.json().income.meal.kopiykas).to.eql(11760000));
    language: text/javascript
order: 4000
