$kind: http-request
name: Профіт групи «Дзвіночок» (менеджер)
url: "{{baseUrl}}/analytics/groups/{{groupDzvinochokId}}/profit"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      const r = pm.response.json();
      pm.test('14 активних дітей, вік 3', () => {
        pm.expect(r.childrenCount).to.eql(14);
        pm.expect(r.age).to.eql(3);
      });
      pm.test('Вихователь: 2 000 · 14 + 3 000 · 2 = 34 000 грн', () =>
        pm.expect(r.expenses.educatorSalary.kopiykas).to.eql(3400000));
      pm.test('Помічник: 20 000 + 3 000 · 2 = 26 000 грн', () =>
        pm.expect(r.expenses.assistantSalary.kopiykas).to.eql(2600000));
      pm.test('Харчування: 400 грн · 21 день · 80% · 14 дітей = 94 080 грн', () =>
        pm.expect(r.income.meal.kopiykas).to.eql(9408000));
      pm.test('Профіт = дохід − витрати', () =>
        pm.expect(r.profit.kopiykas).to.eql(r.income.total.kopiykas - r.expenses.total.kopiykas));
      pm.test('Гривні = копійки / 100', () => pm.expect(r.profit.uah).to.eql(r.profit.kopiykas / 100));
    language: text/javascript
order: 3000
