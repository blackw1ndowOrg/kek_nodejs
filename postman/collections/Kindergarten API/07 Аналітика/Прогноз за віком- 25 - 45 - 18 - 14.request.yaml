$kind: http-request
name: "Прогноз за віком: 25 / 45 / 18 / 14"
url: "{{baseUrl}}/analytics/forecast"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "2": 25,
      "3": 45,
      "4": 18,
      "5": 14
    }
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      const ages = pm.response.json().recommended.ageBreakdown;
      pm.test('Прийнято не більше, ніж хотіли, за кожним віком', () => Object.values(ages).forEach((a) =>
        pm.expect(a.admitted + a.rejected).to.eql(a.demanded)));
      pm.test('Групи не більше 20 дітей', () => Object.values(ages).forEach((a) =>
        a.groupSizes.forEach((size) => pm.expect(size).to.be.at.most(20))));
    language: text/javascript
order: 9000
