$kind: http-request
name: "Батько: реєстрація дитини → 403"
url: "{{baseUrl}}/children"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{}"
auth:
  type: bearer
  credentials:
    token: "{{parentToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Статус 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 3000
