$kind: http-request
url: "{{baseUrl}}/children"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Дитина",
      "birthDate": "{{validBirthDate}}",
      "parentIds": [{{debtorParentId}}],
      "groupId": {{groupSonechkoId}}
    }
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 400', () => pm.response.to.have.status(400));
      pm.test('VALIDATION_ERROR', () => pm.expect(pm.response.json().error.code).to.eql('VALIDATION_ERROR'));
    language: text/javascript
order: 10000
