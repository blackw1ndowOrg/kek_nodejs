$kind: http-request
name: "Батько: список батьків → 403"
url: "{{baseUrl}}/parents"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{parentToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Статус 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 5000
