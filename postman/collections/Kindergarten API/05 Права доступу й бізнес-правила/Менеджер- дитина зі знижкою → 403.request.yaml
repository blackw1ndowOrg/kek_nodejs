$kind: http-request
name: "Менеджер: дитина зі знижкою → 403"
url: "{{baseUrl}}/children"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Дитина Зі Знижкою",
      "birthDate": "{{validBirthDate}}",
      "parentIds": [{{debtorParentId}}],
      "discountPercent": 10
    }
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: beforeRequest
    code: |-
      const now = new Date();
      const academicYear = now.getUTCMonth() >= 8 ? now.getUTCFullYear() : now.getUTCFullYear() - 1;
      pm.collectionVariables.set('validBirthDate', `${academicYear - 3}-03-15`);
    language: text/javascript
  - type: afterResponse
    code: pm.test('Статус 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 9000
