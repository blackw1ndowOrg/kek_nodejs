$kind: http-request
url: "{{baseUrl}}/children"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Дитина",
      "birthDate": "2022-02-30",
      "parentIds": [{{debtorParentId}}]
    }
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Статус 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 12000
