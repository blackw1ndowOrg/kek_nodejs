$kind: http-request
name: Дворічну дитину в групу 3-річних → 400
url: "{{baseUrl}}/groups/{{groupDzvinochokId}}/children"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "childId": {{ownChildId}}
    }
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Статус 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 13000
