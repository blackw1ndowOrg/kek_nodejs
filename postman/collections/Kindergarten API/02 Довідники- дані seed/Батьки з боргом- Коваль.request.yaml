$kind: http-request
name: "Батьки з боргом: Коваль"
url: "{{baseUrl}}/parents?search=Коваль"
method: GET
queryParams:
  search: Коваль
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      const parent = pm.response.json().parents[0];
      pm.test('Борг 15 000 грн', () => pm.expect(parent.debt).to.eql(1500000));
      pm.collectionVariables.set('debtorParentId', parent.id);
    language: text/javascript
order: 7000
