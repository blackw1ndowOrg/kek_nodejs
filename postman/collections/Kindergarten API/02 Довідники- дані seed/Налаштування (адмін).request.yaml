$kind: http-request
url: "{{baseUrl}}/settings"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      const s = pm.response.json().settings;
      pm.test('Ціна навчання 15 000 грн', () => pm.expect(s.TUITION_MONTHLY).to.eql(1500000));
      pm.test('Рівні пільг 10/20/30', () => pm.expect(s.DISCOUNT_LEVELS).to.eql([10, 20, 30]));
    language: text/javascript
order: 1000
