$kind: http-request
name: "Діти (батько Сидоренко): двоє"
url: "{{baseUrl}}/children"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{parent2Token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      pm.test('Двоє дітей', () => pm.expect(pm.response.json().children).to.have.length(2));
    language: text/javascript
order: 10000
