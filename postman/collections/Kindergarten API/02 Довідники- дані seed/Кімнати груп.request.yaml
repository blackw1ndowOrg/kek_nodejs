$kind: http-request
url: "{{baseUrl}}/rooms?type=GROUP"
method: GET
queryParams:
  type: GROUP
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      pm.test('Усі кімнати типу GROUP', () =>
        pm.response.json().rooms.forEach((r) => pm.expect(r.type).to.eql('GROUP')));
    language: text/javascript
order: 2000
