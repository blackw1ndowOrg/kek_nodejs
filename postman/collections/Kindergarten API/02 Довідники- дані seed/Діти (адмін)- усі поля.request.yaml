$kind: http-request
name: "Діти (адмін): усі поля"
url: "{{baseUrl}}/children"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      const children = pm.response.json().children;
      pm.test('Адмін бачить знижку', () => pm.expect(children[0]).to.have.property('discountPercent'));
      pm.collectionVariables.set('allChildIds', JSON.stringify(children.map((c) => c.id)));
    language: text/javascript
order: 8000
