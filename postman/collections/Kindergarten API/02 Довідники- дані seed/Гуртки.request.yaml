$kind: http-request
url: "{{baseUrl}}/clubs"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      pm.test('5 гуртків', () => pm.expect(pm.response.json().clubs).to.have.length(5));
    language: text/javascript
order: 3000
