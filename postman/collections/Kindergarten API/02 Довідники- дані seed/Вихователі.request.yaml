$kind: http-request
url: "{{baseUrl}}/staff?type=EDUCATOR"
method: GET
queryParams:
  type: EDUCATOR
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      pm.test('Лише EDUCATOR', () =>
        pm.response.json().staff.forEach((s) => pm.expect(s.type).to.eql('EDUCATOR')));
    language: text/javascript
order: 6000
