$kind: http-request
name: "Діти (батько Петренко): лише свої, без знижки"
url: "{{baseUrl}}/children"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{parentToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      const children = pm.response.json().children;
      pm.test('Одна дитина', () => pm.expect(children).to.have.length(1));
      pm.test('Немає discountPercent і hasDeputyRelatives', () => {
        pm.expect(children[0]).to.not.have.property('discountPercent');
        pm.expect(children[0]).to.not.have.property('hasDeputyRelatives');
      });
      pm.collectionVariables.set('ownChildId', children[0].id);
      pm.collectionVariables.set('ownChildGroupId', children[0].groupId);
      const all = JSON.parse(pm.collectionVariables.get('allChildIds'));
      pm.collectionVariables.set('foreignChildId', all.find((id) => id !== children[0].id));
    language: text/javascript
order: 9000
