$kind: http-request
name: "Групи (вихователька): лише своя"
url: "{{baseUrl}}/groups"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{educatorToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      const groups = pm.response.json().groups;
      pm.test('Одна група — «Сонечко»', () => {
        pm.expect(groups).to.have.length(1);
        pm.expect(groups[0].name).to.eql('Сонечко');
      });
    language: text/javascript
order: 5000
