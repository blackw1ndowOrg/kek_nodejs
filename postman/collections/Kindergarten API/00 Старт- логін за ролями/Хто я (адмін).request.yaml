$kind: http-request
url: "{{baseUrl}}/auth/me"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      pm.test('Роль ADMIN', () => pm.expect(pm.response.json().user.role).to.eql('ADMIN'));
    language: text/javascript
order: 7000
